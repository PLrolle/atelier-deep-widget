<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier DEEP — Cartographie documentaire</title>
<style>
/* =====================================================================
   DSFR Quick Styler — self-contained stylesheet
   ===================================================================== */
:root {
  --blue-france-975:#f5f5fe; --blue-france-950:#ececfe; --blue-france-925:#e3e3fd;
  --blue-france-850:#cacafb; --blue-france-625:#8585f6; --blue-france-525:#6a6af4;
  --blue-france-200:#2323ff; --blue-france-125:#1212ff; --blue-france-sun:#000091;
  --red-marianne-975:#fef4f4; --red-marianne-950:#fee9e9; --red-marianne-925:#fddede;
  --red-marianne-850:#fcbfbf; --red-marianne-625:#ff8d7e; --red-marianne-472:#e1000f;
  --red-marianne-425:#c9191e;
  --grey-0:#000; --grey-50:#161616; --grey-75:#1e1e1e; --grey-100:#242424;
  --grey-150:#333; --grey-200:#3a3a3a; --grey-425:#666; --grey-625:#929292;
  --grey-850:#cecece; --grey-900:#ddd; --grey-925:#e5e5e5; --grey-950:#eee;
  --grey-975:#f6f6f6; --grey-1000:#fff;
  --info-425:#0063cb; --info-525:#0078f3; --info-950:#e8edff;
  --success-425:#18753c; --success-525:#1f8d49; --success-950:#b8fec9;
  --warning-425:#b34000; --warning-525:#d64d00; --warning-950:#ffe9e6;
  --error-425:#ce0500; --error-525:#e1000f; --error-950:#ffe9e9;
  --bg-default:var(--grey-1000); --bg-alt:var(--grey-975); --bg-alt-blue:var(--blue-france-975);
  --bg-contrast:var(--grey-950); --bg-action-high:var(--blue-france-sun);
  --bg-action-low:var(--blue-france-925);
  --text-title:var(--grey-50); --text-default:var(--grey-200); --text-mention:var(--grey-425);
  --text-blue:var(--blue-france-sun); --text-inverted:var(--grey-1000); --text-inverted-blue:var(--blue-france-975);
  --border-default:var(--grey-900); --border-plain:var(--blue-france-sun);
  --fs-h1:2.5rem; --lh-h1:3rem;
  --fs-h2:2rem;   --lh-h2:2.5rem;
  --fs-h3:1.75rem;--lh-h3:2.25rem;
  --fs-h4:1.5rem; --lh-h4:2rem;
  --fs-h5:1.375rem;--lh-h5:1.75rem;
  --fs-h6:1.25rem;--lh-h6:1.75rem;
  --fs-display:3rem; --lh-display:3.5rem;
  --fs-lead:1.25rem;--lh-lead:2rem;
  --fs-lg:1.125rem;--lh-lg:1.75rem;
  --fs-md:1rem;    --lh-md:1.5rem;
  --fs-sm:.875rem; --lh-sm:1.5rem;
  --fs-xs:.75rem;  --lh-xs:1.25rem;
  --s-1:.25rem; --s-2:.5rem; --s-3:.75rem; --s-4:1rem; --s-5:1.25rem;
  --s-6:1.5rem; --s-8:2rem; --s-10:2.5rem; --s-12:3rem; --s-16:4rem;
  --container-max:78rem; --container-pad:1.5rem;
  --shadow-raised:0 1px 2px 0 rgba(0,0,18,.08);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Marianne',Arial,sans-serif;font-size:var(--fs-md);line-height:var(--lh-md);color:var(--text-default);background:var(--bg-default);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4,h5,h6{color:var(--text-title);font-weight:700;margin:0 0 var(--s-6);font-family:inherit;text-wrap:balance}
h1{font-size:var(--fs-h1);line-height:var(--lh-h1);letter-spacing:-.01em}
h2{font-size:var(--fs-h2);line-height:var(--lh-h2);letter-spacing:-.01em}
h3{font-size:var(--fs-h3);line-height:var(--lh-h3)}
h4{font-size:var(--fs-h4);line-height:var(--lh-h4)}
h5{font-size:var(--fs-h5);line-height:var(--lh-h5)}
h6{font-size:var(--fs-h6);line-height:var(--lh-h6)}
p{margin:0 0 var(--s-6);text-wrap:pretty}
a{color:var(--text-blue);text-underline-offset:2px}
strong{font-weight:700;color:var(--text-title)}
code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.9em;background:var(--bg-contrast);padding:.1em .35em;border-radius:2px}
::selection{background:var(--blue-france-925);color:var(--blue-france-sun)}
:focus-visible{outline:2px solid #0a76f6;outline-offset:2px}

.dsfr-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);padding:var(--s-2) var(--s-4);min-height:2.5rem;border:1px solid transparent;background:var(--bg-action-high);color:var(--text-inverted-blue);font-family:inherit;font-size:var(--fs-md);font-weight:500;line-height:1.5;cursor:pointer;text-decoration:none;border-radius:0;white-space:nowrap;transition:background-color 120ms}
.dsfr-btn:hover{background:var(--blue-france-125);color:var(--text-inverted-blue)}
.dsfr-btn--secondary{background:transparent;color:var(--text-blue);border-color:currentColor}
.dsfr-btn--secondary:hover{background:var(--bg-action-low);color:var(--text-blue)}
.dsfr-btn--sm{min-height:2rem;padding:var(--s-1) var(--s-3);font-size:var(--fs-sm)}

.dsfr-badge{display:inline-flex;align-items:center;gap:var(--s-1);padding:.125rem var(--s-2);font-size:var(--fs-xs);font-weight:700;line-height:1.25rem;text-transform:uppercase;letter-spacing:.02em;background:var(--bg-action-low);color:var(--text-blue)}
.dsfr-badge--success{background:var(--success-950);color:var(--success-425)}
.dsfr-badge--warning{background:var(--warning-950);color:var(--warning-425)}
.dsfr-badge--error{background:var(--error-950);color:var(--error-425)}
.dsfr-badge--info{background:var(--info-950);color:var(--info-425)}
.dsfr-badge--neutral{background:var(--bg-contrast);color:var(--text-default)}

.dsfr-alert{display:flex;gap:var(--s-3);padding:var(--s-4) var(--s-5);border-left:4px solid var(--info-425);background:var(--info-950);color:var(--text-default);margin-bottom:var(--s-6)}
.dsfr-alert__title{margin:0 0 var(--s-1);font-size:var(--fs-md);color:var(--text-title);font-weight:700}
.dsfr-alert__body{margin:0;font-size:var(--fs-sm)}
.dsfr-alert--error{border-left-color:var(--error-425);background:var(--error-950)}

.dsfr-field{display:flex;flex-direction:column;gap:var(--s-2);margin-bottom:var(--s-5)}
.dsfr-label{font-weight:500;color:var(--text-title);font-size:var(--fs-md)}
.dsfr-hint{font-size:var(--fs-sm);color:var(--text-mention)}
.dsfr-input{width:100%;padding:var(--s-2) var(--s-3);min-height:2.5rem;font-family:inherit;font-size:var(--fs-md);color:var(--text-title);background:var(--bg-contrast);border:0;border-bottom:2px solid var(--text-title);border-radius:0;line-height:1.5}

/* =====================================================================
   Atelier DEEP — surcouche spécifique
   ===================================================================== */
header.app-header{background:var(--bg-default);border-bottom:1px solid var(--border-default);padding:var(--s-4) var(--s-6);display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s-4);position:sticky;top:0;z-index:10}
header.app-header .title-block h1{font-size:var(--fs-h5);line-height:var(--lh-h5);margin:0;color:var(--text-title)}
header.app-header .title-block .meta{font-size:var(--fs-sm);color:var(--text-mention);margin-top:var(--s-1)}
header.app-header .title-block .mode-indicator{font-size:var(--fs-xs);color:var(--text-mention);margin-top:var(--s-1);text-transform:uppercase;letter-spacing:.04em}
header.app-header .actions{display:flex;gap:var(--s-2);flex:none}

nav.tabs{background:var(--bg-default);border-bottom:1px solid var(--border-default);padding:0 var(--s-6);display:flex;gap:0;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:var(--s-3) var(--s-4);cursor:pointer;font-family:inherit;font-size:var(--fs-md);color:var(--text-mention);border-bottom:2px solid transparent;font-weight:500;display:inline-flex;align-items:center;gap:var(--s-2);white-space:nowrap}
nav.tabs button:hover{color:var(--text-title)}
nav.tabs button.active{color:var(--text-blue);border-bottom-color:var(--text-blue);font-weight:700}
nav.tabs .count{background:var(--bg-action-low);color:var(--text-blue);padding:.05rem var(--s-2);font-size:var(--fs-xs);font-weight:700;min-width:1.5rem;text-align:center}

main{padding:var(--s-6);max-width:var(--container-max);margin:0 auto}
.view{display:none}
.view.active{display:block}

/* --- Inventaire kanban --- */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s-4);align-items:start}
.column{background:var(--bg-default);border:1px solid var(--border-default);border-top:3px solid var(--text-mention)}
.col-financier{border-top-color:var(--warning-425)}
.col-contractuel{border-top-color:var(--success-425)}
.col-activites{border-top-color:var(--info-425)}
.col-reporting{border-top-color:var(--blue-france-sun)}
.col-crm{border-top-color:var(--text-mention)}
.column-header{padding:var(--s-3) var(--s-4);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-default);background:var(--bg-alt)}
.column-header .col-name{font-weight:700;color:var(--text-title);font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:.04em}
.column-header .col-count{color:var(--text-mention);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.column-body{padding:var(--s-2)}
.doc-card{background:var(--bg-default);border:1px solid var(--border-default);border-bottom:2px solid var(--border-plain);padding:var(--s-3);margin-bottom:var(--s-2);cursor:pointer;transition:background-color 120ms}
.doc-card:hover{background:var(--bg-alt-blue)}
.doc-card.selected{background:var(--bg-alt-blue);border-bottom-width:3px}
.doc-card .doc-name{font-weight:700;color:var(--text-title);margin-bottom:var(--s-1);font-size:var(--fs-sm);line-height:var(--lh-sm)}
.doc-card .doc-meta{font-size:var(--fs-xs);color:var(--text-mention);line-height:var(--lh-xs)}
.doc-card .doc-meta .sep{margin:0 var(--s-1)}
.doc-card .doc-conf{color:var(--text-blue);font-weight:700}
.doc-card .doc-pilote{color:var(--text-title);font-weight:700}
.doc-card .doc-deps{margin-top:var(--s-1)}
.doc-card .doc-deps .dep-label{color:var(--text-mention);text-transform:uppercase;letter-spacing:.02em;font-weight:700;font-size:var(--fs-xs);margin-right:var(--s-1)}
.doc-card .doc-deps .dep-value{color:var(--text-default)}
.doc-card .comment-flag{display:inline-flex;align-items:center;gap:var(--s-1);background:var(--warning-950);color:var(--warning-425);padding:.05rem var(--s-2);font-size:var(--fs-xs);font-weight:700;margin-top:var(--s-2);text-transform:uppercase;letter-spacing:.02em}
.empty-col{padding:var(--s-3);color:var(--text-mention);font-size:var(--fs-sm);font-style:italic}

/* --- Cycle de vie --- */
.cycle-doc{background:var(--bg-default);border:1px solid var(--border-default);border-bottom:2px solid var(--border-plain);padding:var(--s-5);margin-bottom:var(--s-5)}
.cycle-doc h3{font-size:var(--fs-h6);line-height:var(--lh-h6);color:var(--text-title);margin:0 0 var(--s-1)}
.cycle-doc h3 .pipeline-tag{font-weight:500;font-size:var(--fs-sm);color:var(--text-mention);margin-left:var(--s-2)}
.cycle-doc .doc-sub{font-size:var(--fs-sm);color:var(--text-mention);margin:0 0 var(--s-4)}
.timeline{display:flex;gap:0;overflow-x:auto;padding-bottom:var(--s-2)}
.step{min-width:240px;background:var(--bg-alt);border:1px solid var(--border-default);padding:var(--s-3);margin-right:var(--s-4);position:relative;font-size:var(--fs-sm)}
.step:not(:last-child)::after{content:"›";position:absolute;right:-1rem;top:50%;transform:translateY(-50%);color:var(--text-mention);font-size:1.5rem;font-weight:700;z-index:1;line-height:1}
.step .step-title{font-weight:700;margin-bottom:var(--s-2);color:var(--text-title);font-size:var(--fs-sm)}
.step .step-row{margin-bottom:var(--s-1);font-size:var(--fs-xs);line-height:var(--lh-xs)}
.step .step-row .label{color:var(--text-mention);margin-right:var(--s-1);text-transform:uppercase;letter-spacing:.02em;font-size:var(--fs-xs);font-weight:500}
.step.archive{background:var(--success-950);border-color:var(--success-425)}
.step.archive .step-title{color:var(--success-425)}
.step .wimi-path{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:var(--fs-xs);background:var(--bg-default);padding:.1em .35em;word-break:break-all;display:inline-block;margin-top:var(--s-1)}
.step .pain-row{background:var(--warning-950);color:var(--warning-425);padding:var(--s-1) var(--s-2);margin-top:var(--s-2);font-size:var(--fs-xs)}
.step .auto-row{background:var(--success-950);color:var(--success-425);padding:var(--s-1) var(--s-2);margin-top:var(--s-1);font-size:var(--fs-xs)}
.empty-cycle{color:var(--text-mention);font-style:italic;font-size:var(--fs-sm);padding:var(--s-2) 0}

/* --- Pilotage --- */
.persona-section{background:var(--bg-default);border:1px solid var(--border-default);border-bottom:2px solid var(--border-plain);padding:var(--s-5);margin-bottom:var(--s-5)}
.persona-section h3{font-size:var(--fs-h6);line-height:var(--lh-h6);color:var(--text-title);margin:0 0 var(--s-4);display:flex;align-items:center;gap:var(--s-2)}
.question-card{border:1px solid var(--border-default);border-left:4px solid var(--text-mention);padding:var(--s-3) var(--s-4);margin-bottom:var(--s-2);font-size:var(--fs-sm);background:var(--bg-default)}
.question-card.bloquant{border-left-color:var(--error-425)}
.question-card.important{border-left-color:var(--warning-425)}
.question-card.nice{border-left-color:var(--text-mention)}
.question-card .q-text{color:var(--text-title);font-weight:500;line-height:var(--lh-sm)}
.question-card .q-meta{font-size:var(--fs-xs);color:var(--text-mention);margin-top:var(--s-2);display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center}
.empty-persona{color:var(--text-mention);font-style:italic;font-size:var(--fs-sm)}

/* --- Wimi tree --- */
.wimi-intro{margin-bottom:var(--s-3);color:var(--text-mention);font-size:var(--fs-sm)}
.wimi-tree{background:var(--bg-default);border:1px solid var(--border-default);padding:var(--s-5);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:var(--fs-sm);white-space:pre;line-height:1.7;overflow-x:auto}
.wimi-folder{color:var(--text-blue);font-weight:700}
.wimi-doc{color:var(--text-mention)}

/* --- Décisions --- */
.decisions-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-4)}
@media (max-width:900px){.decisions-grid{grid-template-columns:1fr}}
.decisions-col{background:var(--bg-default);border:1px solid var(--border-default);border-bottom:2px solid var(--border-plain);padding:var(--s-4)}
.decisions-col h3{font-size:var(--fs-md);color:var(--text-title);margin:0 0 var(--s-3);display:flex;align-items:center;gap:var(--s-2)}
.decision-item{border:1px solid var(--border-default);padding:var(--s-3);margin-bottom:var(--s-2);font-size:var(--fs-sm)}
.decision-item .d-subject{font-weight:700;color:var(--text-title)}
.decision-item .d-detail{margin-top:var(--s-1);color:var(--text-default);font-size:var(--fs-sm)}
.decision-item .d-author{margin-top:var(--s-2);color:var(--text-mention);font-size:var(--fs-xs)}

/* --- États globaux --- */
.loading,.empty{text-align:center;padding:var(--s-16) var(--s-5);color:var(--text-mention);font-size:var(--fs-sm)}
.error-block{margin:var(--s-8) auto;max-width:38rem}

/* --- Config modal --- */
.config-overlay{position:fixed;inset:0;background:rgba(22,22,22,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:var(--s-4)}
.config-modal{background:var(--bg-default);padding:var(--s-6);max-width:32rem;width:100%;border-top:4px solid var(--border-plain)}
.config-modal h2{font-size:var(--fs-h5);line-height:var(--lh-h5);margin:0 0 var(--s-3);color:var(--text-title)}
.config-modal .modal-intro{font-size:var(--fs-sm);color:var(--text-mention);margin-bottom:var(--s-5)}
</style>
</head>
<body>

<header class="app-header">
  <div class="title-block">
    <h1>Atelier DEEP — Cartographie documentaire</h1>
    <div class="meta" id="meta">Chargement…</div>
    <div class="mode-indicator" id="mode-indicator"></div>
  </div>
  <div class="actions">
    <button id="config-btn" class="dsfr-btn dsfr-btn--secondary dsfr-btn--sm" type="button">Configuration</button>
    <button id="refresh" class="dsfr-btn dsfr-btn--sm" type="button">Recharger</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button data-view="inventaire" class="active" type="button">Inventaire <span class="count" id="count-docs">0</span></button>
  <button data-view="cycle" type="button">Cycle de vie <span class="count" id="count-steps">0</span></button>
  <button data-view="pilotage" type="button">Pilotage <span class="count" id="count-pilotage">0</span></button>
  <button data-view="wimi" type="button">Arborescence Wimi</button>
  <button data-view="decisions" type="button">Décisions &amp; questions <span class="count" id="count-decisions">0</span></button>
</nav>

<main>
  <div id="view-inventaire" class="view active"></div>
  <div id="view-cycle" class="view"></div>
  <div id="view-pilotage" class="view"></div>
  <div id="view-wimi" class="view"></div>
  <div id="view-decisions" class="view"></div>
</main>

<!-- Grist Plugin API : permet à ce widget de lire les tables du document Grist parent.
     Charge depuis l'instance Grist DINUM ; fallback sur getgrist.com pour le dev local. -->
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"
        onerror="this.onerror=null;this.src='https://docs.getgrist.com/grist-plugin-api.js'"></script>

<script>
// ============================================================
// Mode de fonctionnement
// ------------------------------------------------------------
//   1) NORMAL : embarquée dans Grist comme Custom Widget → utilise l'API
//      `grist` injectée par l'iframe parent. Aucune config, aucune clé.
//   2) STANDALONE (preview/dev) : ouverte directement → demande server +
//      docId + apiKey et appelle l'API REST.
// ============================================================

let GRIST_MODE = null;

const CONFIG_KEY = "atelier_deep_config";
function getConfig() {
  try { return JSON.parse(localStorage.getItem(CONFIG_KEY)) || {}; } catch { return {}; }
}
function setConfig(c) { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); }

function showConfig() {
  const c = getConfig();
  const overlay = document.createElement("div");
  overlay.className = "config-overlay";
  overlay.innerHTML = `
    <div class="config-modal" role="dialog" aria-labelledby="cfg-title">
      <h2 id="cfg-title">Configuration (mode standalone)</h2>
      <p class="modal-intro">
        Cette fenêtre apparaît parce que la page est ouverte directement, hors de Grist.
        En usage normal, ajoute-la comme Custom Widget dans Grist et aucune configuration ne sera demandée.
      </p>

      <div class="dsfr-field">
        <label class="dsfr-label" for="cfg-server">Serveur Grist</label>
        <input class="dsfr-input" id="cfg-server" value="${c.server || 'https://grist.numerique.gouv.fr'}" />
      </div>

      <div class="dsfr-field">
        <label class="dsfr-label" for="cfg-docid">Identifiant du document</label>
        <span class="dsfr-hint">Segment de l'URL après /docs/.</span>
        <input class="dsfr-input" id="cfg-docid" value="${c.docId || ''}" placeholder="abc123XYZ" />
      </div>

      <div class="dsfr-field">
        <label class="dsfr-label" for="cfg-apikey">Clé d'API</label>
        <span class="dsfr-hint">Profil Grist → API key.</span>
        <input class="dsfr-input" id="cfg-apikey" type="password" value="${c.apiKey || ''}" />
      </div>

      <button id="cfg-save" class="dsfr-btn" type="button">Enregistrer et charger</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("cfg-save").onclick = () => {
    setConfig({
      server: document.getElementById("cfg-server").value.trim().replace(/\/$/, ""),
      docId: document.getElementById("cfg-docid").value.trim(),
      apiKey: document.getElementById("cfg-apikey").value.trim()
    });
    overlay.remove();
    loadAll();
  };
}

async function fetchTable_widget(tableName) {
  const raw = await grist.docApi.fetchTable(tableName);
  if (!raw || !raw.id) return [];
  const out = [];
  const n = raw.id.length;
  const cols = Object.keys(raw);
  for (let i = 0; i < n; i++) {
    const row = {};
    for (const col of cols) row[col] = raw[col][i];
    out.push(row);
  }
  return out;
}

async function fetchTable_standalone(tableName) {
  const c = getConfig();
  if (!c.server || !c.docId || !c.apiKey) throw new Error("CONFIG_MISSING");
  const url = `${c.server}/api/docs/${encodeURIComponent(c.docId)}/tables/${encodeURIComponent(tableName)}/records`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${c.apiKey}` }});
  if (!res.ok) {
    if (res.status === 404) throw new Error(`Table "${tableName}" introuvable.`);
    if (res.status === 401 || res.status === 403) throw new Error("Clé d'API invalide.");
    throw new Error(`Erreur ${res.status} : ${await res.text()}`);
  }
  const data = await res.json();
  return data.records.map(r => ({ id: r.id, ...r.fields }));
}

async function fetchTable(tableName) {
  if (GRIST_MODE === "widget") return fetchTable_widget(tableName);
  return fetchTable_standalone(tableName);
}

let state = {
  documents: [],
  cycle: [],
  pilotage: [],
  decisions: [],
  selectedDocId: null,
};

async function loadAll() {
  const meta = document.getElementById("meta");
  meta.textContent = "Chargement…";

  if (GRIST_MODE === "standalone") {
    const c = getConfig();
    if (!c.server || !c.docId || !c.apiKey) {
      meta.textContent = "Configuration requise";
      showConfig();
      return;
    }
  }

  try {
    const [docs, cycle, pilotage, decisions] = await Promise.all([
      fetchTable("Documents"),
      fetchTable("Cycle_de_vie"),
      fetchTable("Pilotage"),
      fetchTable("Decisions_questions"),
    ]);
    state = { documents: docs, cycle, pilotage, decisions, selectedDocId: state.selectedDocId };
    meta.textContent = `Dernière mise à jour : ${new Date().toLocaleTimeString('fr-FR')} · ${docs.length} documents · ${cycle.length} étapes · ${pilotage.length} questions de pilotage · ${decisions.length} arbitrages`;
    document.getElementById("count-docs").textContent = docs.length;
    document.getElementById("count-steps").textContent = cycle.length;
    document.getElementById("count-pilotage").textContent = pilotage.length;
    document.getElementById("count-decisions").textContent = decisions.length;
    renderAll();
  } catch (e) {
    if (e.message === "CONFIG_MISSING") {
      meta.textContent = "Configuration requise";
      showConfig();
    } else {
      showError(e.message);
    }
  }
}

function showError(msg) {
  const html = `
    <div class="error-block">
      <div class="dsfr-alert dsfr-alert--error">
        <div>
          <p class="dsfr-alert__title">Impossible de charger les données</p>
          <p class="dsfr-alert__body">${escapeHtml(msg)}</p>
          <p class="dsfr-alert__body" style="margin-top:var(--s-2);">Vérifications à faire :</p>
          <ul style="margin:var(--s-1) 0 0 1.25rem;font-size:var(--fs-sm);">
            <li>Les 4 tables existent dans Grist avec ces noms exacts : <code>Documents</code>, <code>Cycle_de_vie</code>, <code>Pilotage</code>, <code>Decisions_questions</code></li>
            <li>La configuration (bouton « Configuration » en haut à droite) est correcte</li>
            <li>La clé d'API a bien accès au document</li>
          </ul>
        </div>
      </div>
    </div>
  `;
  document.querySelectorAll(".view").forEach(v => v.innerHTML = html);
}

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

// RefList depuis Grist : ["L", rowId1, rowId2, ...]
function refListIds(v) {
  if (Array.isArray(v) && v[0] === "L") return v.slice(1).filter(x => typeof x === "number");
  return [];
}
function docNames(ids) {
  return ids.map(id => state.documents.find(d => d.id === id)?.nom || `#${id}`).join(", ");
}
function depLine(label, ids) {
  if (!ids.length) return "";
  return `<div class="doc-meta doc-deps"><span class="dep-label">${label}</span><span class="dep-value">${escapeHtml(docNames(ids))}</span></div>`;
}

function renderAll() {
  renderInventaire();
  renderCycle();
  renderPilotage();
  renderWimi();
  renderDecisions();
}

// --- Inventaire (kanban par pipeline) ---
function renderInventaire() {
  const pipelines = ["Financier", "Contractuel", "Activités", "Reporting", "CRM"];
  const colors = { "Financier":"col-financier","Contractuel":"col-contractuel","Activités":"col-activites","Reporting":"col-reporting","CRM":"col-crm" };
  const byPipeline = {};
  pipelines.forEach(p => byPipeline[p] = []);
  state.documents.forEach(d => {
    if (byPipeline[d.pipeline]) byPipeline[d.pipeline].push(d);
  });

  const html = `
    <div class="kanban">
      ${pipelines.map(p => `
        <div class="column ${colors[p]}">
          <div class="column-header">
            <span class="col-name">${p}</span>
            <span class="col-count">${byPipeline[p].length}</span>
          </div>
          <div class="column-body">
            ${byPipeline[p].length === 0 ? '<div class="empty-col">Aucun document</div>' :
              byPipeline[p].map(d => `
                <div class="doc-card ${d.id === state.selectedDocId ? 'selected':''}" data-doc-id="${d.id}">
                  <div class="doc-name">${escapeHtml(d.nom)}</div>
                  <div class="doc-meta">
                    ${d.nature ? escapeHtml(d.nature) : ''}
                    ${d.nature && d.format_type ? '<span class="sep">·</span>' : ''}
                    ${d.format_type ? escapeHtml(d.format_type) : ''}
                  </div>
                  <div class="doc-meta">
                    ${d.confidentialite ? `<span class="doc-conf">${escapeHtml(d.confidentialite)}</span>` : ''}
                    ${d.confidentialite && d.saisi_par_atelier ? '<span class="sep">·</span>' : ''}
                    ${d.saisi_par_atelier ? escapeHtml(d.saisi_par_atelier) : ''}
                  </div>
                  ${d.pilote ? `<div class="doc-meta"><span class="doc-pilote">Pilote : ${escapeHtml(d.pilote)}</span></div>` : ''}
                  ${depLine('Requiert', refListIds(d.prerequis))}
                  ${depLine('Requis pour', refListIds(d.requis_pour))}
                  ${d.commentaire_autre ? `<div class="comment-flag">💬 Commentaire</div>`:''}
                </div>
              `).join('')
            }
          </div>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById("view-inventaire").innerHTML = html;
  document.querySelectorAll(".doc-card").forEach(c => {
    c.onclick = () => {
      state.selectedDocId = parseInt(c.dataset.docId);
      renderInventaire();
      switchView("cycle");
    };
  });
}

// --- Cycle de vie (timelines par document) ---
function renderCycle() {
  const byDoc = {};
  state.cycle.forEach(s => {
    const docId = s.document;
    if (!byDoc[docId]) byDoc[docId] = [];
    byDoc[docId].push(s);
  });
  Object.keys(byDoc).forEach(k => byDoc[k].sort((a,b) => (a.ordre||0)-(b.ordre||0)));

  const sortedDocs = [...state.documents].sort((a,b) => {
    if (a.id === state.selectedDocId) return -1;
    if (b.id === state.selectedDocId) return 1;
    return 0;
  });

  const html = sortedDocs.map(d => {
    const steps = byDoc[d.id] || [];
    return `
      <div class="cycle-doc">
        <h3>${escapeHtml(d.nom)}<span class="pipeline-tag">${escapeHtml(d.pipeline||'?')}</span></h3>
        <div class="doc-sub">${escapeHtml(d.nature||'')}${d.nature && d.format_type ? ' · ' : ''}${escapeHtml(d.format_type||'')}</div>
        ${steps.length === 0 ? '<div class="empty-cycle">Aucune étape définie. Ajoute des lignes dans la table <b>Cycle_de_vie</b> pointant vers ce document.</div>' :
          `<div class="timeline">
            ${steps.map(s => {
              const isArchive = (s.chemin_wimi_cible && s.chemin_wimi_cible.length > 0);
              return `
                <div class="step ${isArchive?'archive':''}">
                  <div class="step-title">${s.ordre ? s.ordre + '. ' : ''}${escapeHtml(s.etape||'(sans titre)')}</div>
                  ${s.declencheur ? `<div class="step-row"><span class="label">Déclencheur</span>${escapeHtml(s.declencheur)}</div>`:''}
                  ${s.producteur ? `<div class="step-row"><span class="label">Producteur</span>${escapeHtml(s.producteur)}</div>`:''}
                  ${s.valideurs ? `<div class="step-row"><span class="label">Valideurs</span>${escapeHtml(s.valideurs)}</div>`:''}
                  ${s.destinataires ? `<div class="step-row"><span class="label">Destinataires</span>${escapeHtml(s.destinataires)}</div>`:''}
                  ${s.stocke_chaud_dans ? `<div class="step-row"><span class="label">Stockage chaud</span>${escapeHtml(s.stocke_chaud_dans)}</div>`:''}
                  ${s.frequence ? `<div class="step-row"><span class="label">Fréquence</span>${escapeHtml(s.frequence)}</div>`:''}
                  ${s.chemin_wimi_cible ? `<div class="step-row"><span class="label">Wimi</span><br><span class="wimi-path">${escapeHtml(s.chemin_wimi_cible)}</span></div>`:''}
                  ${s.condition_archivage_wimi ? `<div class="step-row"><span class="label">Condition d'archivage</span>${escapeHtml(s.condition_archivage_wimi)}</div>`:''}
                  ${s.pain_point ? `<div class="pain-row"><b>Frein</b> · ${escapeHtml(s.pain_point)}</div>`:''}
                  ${s.automatisable && s.automatisable !== 'Non' ? `<div class="auto-row"><b>Automatisable</b> · ${escapeHtml(s.automatisable)}${s.commentaire_automatisation ? ' — '+escapeHtml(s.commentaire_automatisation):''}</div>`:''}
                </div>
              `;
            }).join('')}
          </div>`
        }
      </div>
    `;
  }).join('');
  document.getElementById("view-cycle").innerHTML = html || '<div class="empty">Aucun document dans l\'inventaire.</div>';
}

// --- Pilotage (groupé par persona) ---
function renderPilotage() {
  const personas = ["Team Leader", "Project Manager HQ", "Field Project Manager", "Lead Expert"];
  const byPersona = {};
  personas.forEach(p => byPersona[p] = []);
  state.pilotage.forEach(q => {
    if (byPersona[q.persona]) byPersona[q.persona].push(q);
  });

  const criticiteClass = (c) => {
    if (c === "Bloquant") return "bloquant";
    if (c === "Important") return "important";
    return "nice";
  };
  const criticiteBadge = (c) => {
    if (c === "Bloquant") return '<span class="dsfr-badge dsfr-badge--error">Bloquant</span>';
    if (c === "Important") return '<span class="dsfr-badge dsfr-badge--warning">Important</span>';
    if (c === "Nice-to-have") return '<span class="dsfr-badge dsfr-badge--neutral">Nice-to-have</span>';
    return '';
  };

  const html = personas.map(p => `
    <div class="persona-section">
      <h3>${p} <span class="dsfr-badge">${byPersona[p].length}</span></h3>
      ${byPersona[p].length === 0 ? '<div class="empty-persona">Aucune question définie pour ce persona.</div>' :
        byPersona[p].map(q => `
          <div class="question-card ${criticiteClass(q.criticite)}">
            <div class="q-text">${escapeHtml(q.question||'(sans énoncé)')}</div>
            <div class="q-meta">
              ${q.criticite ? criticiteBadge(q.criticite) : ''}
              ${q.frequence_consultation ? `<span>Consultation · ${escapeHtml(q.frequence_consultation)}</span>`:''}
              ${q.agregation ? `<span>Agrégation · ${escapeHtml(q.agregation)}</span>`:''}
              ${q.format_souhaite ? `<span>Format · ${escapeHtml(q.format_souhaite)}</span>`:''}
            </div>
          </div>
        `).join('')
      }
    </div>
  `).join('');
  document.getElementById("view-pilotage").innerHTML = html;
}

// --- Arbo Wimi ---
function renderWimi() {
  const paths = state.cycle
    .filter(s => s.chemin_wimi_cible && s.chemin_wimi_cible.trim())
    .map(s => ({ path: s.chemin_wimi_cible.trim(), doc: state.documents.find(d => d.id === s.document)?.nom || '?' }));

  if (paths.length === 0) {
    document.getElementById("view-wimi").innerHTML = '<div class="empty">Aucun chemin Wimi renseigné dans <b>Cycle_de_vie</b> → champ <code>chemin_wimi_cible</code>.</div>';
    return;
  }

  const tree = {};
  paths.forEach(({path, doc}) => {
    const parts = path.split('/').filter(p => p.length > 0);
    let node = tree;
    parts.forEach((part, i) => {
      if (!node[part]) node[part] = { __docs: [], __children: {} };
      if (i === parts.length - 1) node[part].__docs.push(doc);
      node = node[part].__children;
    });
  });

  function renderNode(node, depth) {
    let out = '';
    const keys = Object.keys(node).sort();
    keys.forEach(k => {
      const indent = '  '.repeat(depth);
      out += `${indent}<span class="wimi-folder">📁 ${escapeHtml(k)}/</span>\n`;
      if (node[k].__docs.length > 0) {
        node[k].__docs.forEach(d => {
          out += `${indent}    <span class="wimi-doc">📄 ${escapeHtml(d)}</span>\n`;
        });
      }
      out += renderNode(node[k].__children, depth + 1);
    });
    return out;
  }

  const html = `
    <div class="wimi-intro">
      Arborescence déduite des chemins renseignés dans <code>Cycle_de_vie.chemin_wimi_cible</code>.
      Cible à figer en fin d'atelier.
    </div>
    <div class="wimi-tree">${renderNode(tree, 0)}</div>
  `;
  document.getElementById("view-wimi").innerHTML = html;
}

// --- Décisions ---
function renderDecisions() {
  const types = ["Décision prise", "Question ouverte", "Hors-périmètre Grist"];
  const byType = {};
  types.forEach(t => byType[t] = []);
  state.decisions.forEach(d => {
    if (byType[d.type]) byType[d.type].push(d);
  });

  const html = `
    <div class="decisions-grid">
      ${types.map(t => `
        <div class="decisions-col">
          <h3>${t} <span class="dsfr-badge">${byType[t].length}</span></h3>
          ${byType[t].length === 0 ? '<div class="empty-persona">Vide.</div>' :
            byType[t].map(d => `
              <div class="decision-item">
                <div class="d-subject">${escapeHtml(d.sujet||'')}</div>
                ${d.detail ? `<div class="d-detail">${escapeHtml(d.detail)}</div>`:''}
                <div class="d-author">${escapeHtml(d.auteur||'')}${d.statut ? ' · '+escapeHtml(d.statut) : ''}</div>
              </div>
            `).join('')
          }
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById("view-decisions").innerHTML = html;
}

function switchView(name) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.view === name));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-"+name));
}

document.querySelectorAll("nav.tabs button").forEach(b => {
  b.onclick = () => switchView(b.dataset.view);
});

document.getElementById("refresh").onclick = loadAll;
document.getElementById("config-btn").onclick = showConfig;

function bootstrap() {
  if (typeof grist !== "undefined" && grist && grist.ready) {
    GRIST_MODE = "widget";
    document.getElementById("config-btn").style.display = "none";
    document.getElementById("mode-indicator").textContent = "Custom Widget Grist";
    grist.ready({ requiredAccess: "full" });
    grist.onRecords(() => { loadAll(); });
    loadAll();
  } else {
    GRIST_MODE = "standalone";
    document.getElementById("mode-indicator").textContent = "Mode standalone";
    setInterval(loadAll, 30000);
    loadAll();
  }
}

if (document.readyState === "complete") {
  bootstrap();
} else {
  window.addEventListener("load", bootstrap);
}
</script>
